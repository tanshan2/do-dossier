<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>港股 D&amp;O 档案库</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: filing-cabinet split — index of companies on the left, the open dossier on the right; stacks on phones. */
:root{
  --paper:#f5f6f3; --sheet:#ffffff; --ink:#18221f; --muted:#5d6b66; --rule:#dfe3de; --soft:#eef1ec;
  --jade:#0e5a4b; --jade-soft:#dcebe5; --amber:#a86b00; --amber-soft:#f6ead2; --slate:#6b746f; --slate-soft:#e9ece9;
  --red:#a33a2a; --red-soft:#f6e1dc;
  --f-display:"Noto Serif SC","Songti SC",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111715; --sheet:#18201d; --ink:#e6ece9; --muted:#9aa8a2; --rule:#2c3632; --soft:#1f2925;
  --jade:#5fc2a6; --jade-soft:#173a31; --amber:#e3a83c; --amber-soft:#3a2d12; --slate:#a3aca7; --slate-soft:#262e2b;
  --red:#ef8a76; --red-soft:#3d1f19; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111715; --sheet:#18201d; --ink:#e6ece9; --muted:#9aa8a2; --rule:#2c3632; --soft:#1f2925;
  --jade:#5fc2a6; --jade-soft:#173a31; --amber:#e3a83c; --amber-soft:#3a2d12; --slate:#a3aca7; --slate-soft:#262e2b;
  --red:#ef8a76; --red-soft:#3d1f19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1360px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:18px}
h1{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:12.5px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:700}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
/* index */
.index{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
@media (max-width:860px){.index{position:static;max-height:none}}
.idx-tools{padding:12px;display:grid;gap:8px;border-bottom:1px solid var(--rule)}
.idx-row{display:flex;gap:6px;flex-wrap:wrap}
input,textarea,select{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:34px;line-height:1.5}
input:focus,textarea:focus,select:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--jade);outline-offset:1px}
.chipbtn{border:1px solid var(--rule);background:var(--sheet);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.list{overflow:auto;flex:1}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--rule);cursor:pointer;background:none;border-left:3px solid transparent;width:100%;text-align:left;font:inherit;color:inherit;border-top:0;border-right:0}
.item:hover{background:var(--soft)}
.item[aria-current="true"]{background:var(--jade-soft);border-left-color:var(--jade)}
.item .code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.item .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{grid-column:2/4;font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.pri{display:inline-grid;place-items:center;min-width:24px;height:22px;border-radius:4px;font-family:var(--f-mono);font-weight:500;font-size:12px;padding:0 5px}
.pri.A{background:var(--jade);color:var(--sheet)}
.pri.B{background:var(--amber-soft);color:var(--amber)}
.pri.C{background:var(--slate-soft);color:var(--slate)}
.pri.none{background:transparent;color:var(--muted);border:1px dashed var(--rule)}
.st{font-size:11px;padding:1px 7px;border-radius:999px}
.st.done{background:var(--jade-soft);color:var(--jade)}
.st.wip{background:var(--amber-soft);color:var(--amber)}
.st.todo{background:var(--slate-soft);color:var(--slate)}
/* dossier */
.dossier{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;min-width:0}
.d-head{padding:20px 22px 16px;border-bottom:1px solid var(--rule);display:grid;gap:10px}
.d-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px}
.d-title h2{font-family:var(--f-display);font-size:26px;margin:0;line-height:1.25}
.d-title .code{font-family:var(--f-mono);color:var(--muted);font-size:14px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn{font:inherit;font-size:13px;border-radius:4px;padding:6px 14px;cursor:pointer;border:1px solid var(--rule);background:var(--sheet);color:var(--ink)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--sheet)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.small{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;align-items:start;padding:12px 14px;border-radius:5px;background:var(--soft)}
.verdict .big{font-family:var(--f-mono);font-size:30px;line-height:1;font-weight:500;padding:6px 12px;border-radius:5px}
.verdict .big.A{background:var(--jade);color:var(--sheet)} .verdict .big.B{background:var(--amber-soft);color:var(--amber)} .verdict .big.C{background:var(--slate-soft);color:var(--slate)} .verdict .big.none{border:1px dashed var(--rule);color:var(--muted)}
.verdict .lbl{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.d-body{padding:6px 22px 24px}
section.sec{padding-top:18px}
section.sec>h3{font-family:var(--f-display);font-size:16px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
section.sec>h3 .letter{font-family:var(--f-mono);font-size:12px;color:var(--sheet);background:var(--ink);border-radius:3px;padding:1px 6px}
h4{font-size:13px;margin:14px 0 6px;color:var(--jade)}
dl.kv{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr);margin:0;border-top:1px solid var(--rule)}
dl.kv dt,dl.kv dd{margin:0;padding:6px 8px;border-bottom:1px solid var(--rule)}
dl.kv dt{color:var(--muted);font-size:13px;background:var(--soft)}
dl.kv dd{white-space:pre-wrap;overflow-wrap:anywhere}
dl.kv dd.empty{color:var(--muted);opacity:.6}
@media (max-width:520px){dl.kv{grid-template-columns:minmax(0,1fr)}dl.kv dt{border-bottom:0;padding-bottom:0}}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{background:var(--soft);color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td{overflow-wrap:anywhere;min-width:90px}
td.num{font-variant-numeric:tabular-nums}
.edit td{padding:4px}
.stars{color:var(--amber);letter-spacing:2px;font-size:15px;white-space:nowrap}
.stars .off{color:var(--rule)}
.score-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.score{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--rule);border-radius:4px}
.starbtn{background:none;border:0;padding:0 1px;font-size:18px;cursor:pointer;color:var(--rule);line-height:1}
.starbtn.on{color:var(--amber)}
.sources{font-size:12px;color:var(--muted);display:grid;gap:4px;overflow-wrap:anywhere}
.sources a{color:var(--jade)}
.empty-state{padding:60px 24px;text-align:center;color:var(--muted)}
.empty-state h2{font-family:var(--f-display);color:var(--ink);font-size:20px;margin:0 0 6px}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:5px;font-size:13px;z-index:20}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:15;padding:16px}
.modal{background:var(--sheet);border-radius:6px;padding:20px;width:min(420px,100%);display:grid;gap:10px}
.modal h3{margin:0;font-family:var(--f-display)}
.inline-confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--red);flex-wrap:wrap}
.editbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--jade-soft);border-bottom:1px solid var(--rule);padding:8px 22px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
label.f{display:grid;gap:3px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>港股 D&amp;O 公司档案库</h1>
      <div class="sub">2025 年 12 月 + 2026 年上半年港股新上市公司（上半年批次仅民企） · 按 D&amp;O 公司调查模板（A–I）整理 · 只读</div>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="layout">
    <aside class="index" aria-label="公司列表">
      <div class="idx-tools">
        <input id="q" type="search" placeholder="搜索代号、公司名、城市">
        <div class="idx-row" id="batches"></div>
        <div class="idx-row" id="filters"></div>
        <button class="btn small" id="addBtn" type="button">＋ 新增公司</button>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <main class="dossier" id="dossier">
      <div class="empty-state"><h2>正在打开档案库…</h2><p>公司档案会出现在这里。</p></div>
    </main>
  </div>
</div>
<div id="modalRoot"></div>

<script>
const A_F=["公司名称","中文名称","股票代号","上市市场","上市日期","IPO价格","上市时市值","目前股价","52周高位","52周低位","目前市值","市值排名/大约级别","公司总部","主要营运地区","公司网站","行业","主要业务","公司性质"];
const B_F=["目前股价","市值","52周高","52周低","市盈率 PE","市帐率 PB","股息率","日均成交额","流通股比例","主要股东持股","第一大股东","第二大股东","股权集中度"];
const C_F=["收入 Revenue","毛利 Gross Profit","毛利率","净利润 Net Profit","股东应占盈利","EPS","经营现金流","现金及现金等价物","总负债","净负债","资产总值","净资产","ROE"];
const ECTRL_F=["实际控制人","控股股东","第一大股东","管理层持股","是否存在一致行动人","备注"];
const H_F=["财务风险","业务风险","股权风险","管治风险","个人D&O风险"];
const I_F=["市值适合度","公司近况","D&O风险","香港人脉可能性","CFO/CS切入可能性","ED人脉价值","老板可能有共同人脉","值得投入时间"];
const LISTS={
  D:{cols:["时间","事件"]},
  E:{cols:["股东","持股比例","身份","进入时间","最近变化"]},
  F_ed:{cols:["人物","职位","任职时间","背景","优先级"]},
  F_cfo:{cols:["人物","职位","任职时间","香港背景","优先级"]},
  G:{cols:["入口","姓名","香港背景","可能认识 / 关系网","老板共同人脉"]},
};
const STATUS={"已完成":"done","录入中":"wip","待录入":"todo"};

let db=null, canWrite=true, docs=new Map(), sel=null, editing=false, draft=null, filter="全部", confirmDel=false, batch="全部批次";
const BATCHES={"全部批次":"全部批次","2025-12":"2025年12月","2026H1":"2026上半年"};
const batchOf=d=>d.batch||"2025-12";
const inBatch=d=>batch==="全部批次"||batchOf(d)===batch;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}

function blank(code,name){
  return {code,name,status:"待录入",priority:"",priorityNote:"",next:"",listDate:"",city:"",note:"",
    A:{"股票代号":code?code+".HK":"","中文名称":name||""},B:{},C_cols:["最新年度","最新半年"],C:{},D:[],E:[],Ectrl:{},F_ed:[],F_cfo:[],F_ned:"",G:[],H:{},I:{},sources:[]};
}
function norm(d){const b=blank(d.code,d.name);return Object.assign(b,structuredClone(d))}

/* ---------- index ---------- */
function renderStats(){
  const all=[...docs.values()].filter(inBatch);
  const c=k=>all.filter(d=>d.priority===k).length;
  const done=all.filter(d=>d.status==="已完成").length;
  $("#stats").innerHTML=`<span class="stat">共 <b>${all.length}</b> 家</span><span class="stat">已完成 <b>${done}</b></span><span class="stat">A 级 <b>${c("A")}</b></span><span class="stat">B 级 <b>${c("B")}</b></span><span class="stat">C 级 <b>${c("C")}</b></span>`;
}
function renderFilters(){
  const opts=["全部","A","B","C","已完成","待录入"];
  $("#batches").innerHTML=Object.entries(BATCHES).map(([k,v])=>`<button type="button" class="chipbtn" aria-pressed="${k===batch}" data-b="${k}">${v}</button>`).join("");
  $("#filters").innerHTML=opts.map(o=>`<button type="button" class="chipbtn" aria-pressed="${o===filter}" data-f="${o}">${o==="A"||o==="B"||o==="C"?o+" 级":o}</button>`).join("");
}
function sortKey(d){return ({"A":0,"B":1,"C":2}[d.priority]??3)+"|"+(d.listDate||"9")+"|"+d.code}
function renderList(){
  const q=$("#q").value.trim().toLowerCase();
  let arr=[...docs.values()].filter(d=>{
    if(!inBatch(d))return false;
    if(filter==="A"||filter==="B"||filter==="C"){if(d.priority!==filter)return false}
    else if(filter!=="全部"&&d.status!==filter)return false;
    if(!q)return true;
    return [d.code,d.name,d.city,d.A?.["公司名称"],d.A?.["行业"]].join(" ").toLowerCase().includes(q);
  }).sort((a,b)=>sortKey(a)<sortKey(b)?-1:1);
  if(!docs.size){$("#list").innerHTML=`<div class="note" style="padding:16px">还没有公司。点「新增公司」录入第一家。</div>`;return}
  if(!arr.length){$("#list").innerHTML=`<div class="note" style="padding:16px">没有符合条件的公司。</div>`;return}
  $("#list").innerHTML=arr.map(d=>{
    const p=d.priority||"none";
    const mc=d.B?.["市值"]||"";
    return `<button type="button" class="item" data-code="${esc(d.code)}" aria-current="${d.code===sel}">
      <span class="pri ${p}">${esc(d.priority||"–")}</span>
      <span class="nm">${esc(d.name||"未命名")}</span>
      <span class="code">${esc(d.code)}</span>
      <span class="meta"><span class="st ${STATUS[d.status]||"todo"}">${esc(d.status||"待录入")}</span><span>${batchOf(d)==="2026H1"?"26上半年":"25年12月"}</span>${d.listDate?`<span>${esc(d.listDate)}</span>`:""}${d.city?`<span>${esc(d.city)}</span>`:""}${mc?`<span>${esc(mc)}</span>`:""}</span>
    </button>`}).join("");
}

/* ---------- view ---------- */
const val=v=>v&&String(v).trim()?esc(v):"";
function kvView(fields,obj){return `<dl class="kv">${fields.map(f=>{const v=val(obj?.[f]);return `<dt>${esc(f)}</dt><dd class="${v?"":"empty"}">${v||"—"}</dd>`}).join("")}</dl>`}
function starsHtml(n){n=Math.max(0,Math.min(5,+n||0));return `<span class="stars" aria-label="${n} 星">${"★".repeat(n)}<span class="off">${"★".repeat(5-n)}</span></span>`}
function listView(key,rows){
  const cols=LISTS[key].cols;
  if(!rows?.length)return `<div class="note">暂无记录</div>`;
  return `<div class="tbl"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map((c,i)=>{const v=r[i]??"";return /优先级|共同人脉/.test(c)&&/★/.test(v)?`<td class="stars">${esc(v)}</td>`:`<td>${val(v)||"—"}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function cView(d){
  return `<div class="tbl"><table><thead><tr><th>指标</th><th>${esc(d.C_cols[0])}</th><th>${esc(d.C_cols[1])}</th><th>趋势</th></tr></thead><tbody>${C_F.map(f=>{const r=d.C?.[f]||[];return `<tr><th scope="row" style="white-space:normal">${esc(f)}</th><td class="num">${val(r[0])||"—"}</td><td class="num">${val(r[1])||"—"}</td><td>${val(r[2])||"—"}</td></tr>`}).join("")}</tbody></table></div>`;
}
function sec(letter,title,html){return `<section class="sec"><h3><span class="letter">${letter}</span>${esc(title)}</h3>${html}</section>`}
function linkify(s){const e=esc(s);return e.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}

function renderView(d){
  const p=d.priority||"none";
  $("#dossier").innerHTML=`
  <div class="d-head">
    <div class="d-title"><h2>${esc(d.name||"未命名")}</h2><span class="code">${esc(d.code)}.HK</span><span class="st ${STATUS[d.status]||"todo"}">${esc(d.status||"待录入")}</span>
      <div class="d-actions">${canWrite?`<button class="btn primary" type="button" id="editBtn">编辑</button>`:""}</div></div>
    ${d.note?`<div class="note">备注：${esc(d.note)}</div>`:""}
    <div class="verdict"><div class="big ${p}">${esc(d.priority||"–")}</div>
      <div><div class="lbl">D&amp;O Priority · 判断理由</div><div>${val(d.priorityNote)||'<span class="note">尚未评估</span>'}</div>
      <div class="lbl" style="margin-top:6px">下一步先查谁</div><div>${val(d.next)||'<span class="note">—</span>'}</div></div></div>
  </div>
  <div class="d-body">
    ${sec("A","公司基本资料",kvView(A_F,d.A))}
    ${sec("B","市场数据",kvView(B_F,d.B))}
    ${sec("C","公司财务状况",cView(d))}
    ${sec("D","最近 12–24 个月重大事件",listView("D",d.D))}
    ${sec("E","股东结构",listView("E",d.E)+`<h4>谁控制这家公司？</h4>`+kvView(ECTRL_F,d.Ectrl))}
    ${sec("F","董事会结构",`<h4>Executive Directors / 核心决策人</h4>${listView("F_ed",d.F_ed)}<h4>CFO / Company Secretary</h4>${listView("F_cfo",d.F_cfo)}<h4>NED / INED（背景备查）</h4><div style="white-space:pre-wrap">${val(d.F_ned)||'<span class="note">—</span>'}</div>`)}
    ${sec("G","香港人脉入口",listView("G",d.G))}
    ${sec("H","公司 D&O Risk",kvView(H_F,d.H))}
    ${sec("I","开发价值评分",`<div class="score-grid">${I_F.map(f=>`<div class="score"><span>${esc(f)}</span>${starsHtml(d.I?.[f])}</div>`).join("")}</div>`)}
    ${d.sources?.length?`<section class="sec"><h3>资料来源</h3><div class="sources">${d.sources.map(s=>`<div>${linkify(s)}</div>`).join("")}</div></section>`:""}
  </div>`;
}

/* ---------- edit ---------- */
const ta=(path,v,rows=1)=>`<textarea data-p="${esc(path)}" rows="${rows}">${esc(v)}</textarea>`;
const inp=(path,v,ph="")=>`<input data-p="${esc(path)}" value="${esc(v)}" placeholder="${esc(ph)}">`;
function kvEdit(sec,fields,obj){return `<dl class="kv">${fields.map(f=>`<dt>${esc(f)}</dt><dd>${ta(sec+"."+f,obj?.[f]??"",(obj?.[f]||"").length>40?2:1)}</dd>`).join("")}</dl>`}
function listEdit(key,rows){
  const cols=LISTS[key].cols;
  return `<div class="tbl edit"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}<th></th></tr></thead><tbody>${(rows||[]).map((r,ri)=>`<tr>${cols.map((c,ci)=>`<td>${ta(`${key}#${ri}#${ci}`,r[ci]??"",1)}</td>`).join("")}<td><button class="btn small danger" type="button" data-delrow="${key}#${ri}" aria-label="删除这一行">删除</button></td></tr>`).join("")}</tbody></table></div><button class="btn small" type="button" data-addrow="${key}" style="margin-top:6px">＋ 添加一行</button>`;
}
function renderEdit(){
  const d=draft;
  $("#dossier").innerHTML=`
  <div class="editbar"><b>正在编辑：${esc(d.name||d.code)}</b><span class="note">改完点保存，所有人都会看到最新版本。</span>
    <span style="margin-left:auto;display:flex;gap:8px"><button class="btn" type="button" id="cancelBtn">取消</button><button class="btn primary" type="button" id="saveBtn">保存</button></span></div>
  <div class="d-head">
    <div class="grid2">
      <label class="f">公司简称${inp("name",d.name)}</label>
      <label class="f">股份代号<input value="${esc(d.code)}" disabled></label>
      <label class="f">上市日期${inp("listDate",d.listDate,"如 12月3日")}</label>
      <label class="f">城市${inp("city",d.city)}</label>
      <label class="f">录入状态<select data-p="status">${Object.keys(STATUS).map(s=>`<option ${s===d.status?"selected":""}>${s}</option>`).join("")}</select></label>
      <label class="f">D&amp;O Priority<select data-p="priority">${["","A","B","C"].map(s=>`<option value="${s}" ${s===d.priority?"selected":""}>${s||"未评估"}</option>`).join("")}</select></label>
    </div>
    <label class="f">判断理由${ta("priorityNote",d.priorityNote,2)}</label>
    <label class="f">下一步先查谁${ta("next",d.next,2)}</label>
    <label class="f">备注${ta("note",d.note,1)}</label>
  </div>
  <div class="d-body">
    ${sec("A","公司基本资料",kvEdit("A",A_F,d.A))}
    ${sec("B","市场数据",kvEdit("B",B_F,d.B))}
    ${sec("C","公司财务状况",`<div class="grid2" style="margin-bottom:8px"><label class="f">第 1 列标题${inp("C_cols#0",d.C_cols[0])}</label><label class="f">第 2 列标题${inp("C_cols#1",d.C_cols[1])}</label></div>
      <div class="tbl edit"><table><thead><tr><th>指标</th><th>${esc(d.C_cols[0])}</th><th>${esc(d.C_cols[1])}</th><th>趋势</th></tr></thead><tbody>${C_F.map(f=>{const r=d.C?.[f]||[];return `<tr><th scope="row" style="white-space:normal">${esc(f)}</th>${[0,1,2].map(i=>`<td>${ta(`C.${f}#${i}`,r[i]??"",1)}</td>`).join("")}</tr>`}).join("")}</tbody></table></div>`)}
    ${sec("D","最近 12–24 个月重大事件",listEdit("D",d.D))}
    ${sec("E","股东结构",listEdit("E",d.E)+`<h4>谁控制这家公司？</h4>`+kvEdit("Ectrl",ECTRL_F,d.Ectrl))}
    ${sec("F","董事会结构",`<h4>Executive Directors / 核心决策人</h4>${listEdit("F_ed",d.F_ed)}<h4>CFO / Company Secretary</h4>${listEdit("F_cfo",d.F_cfo)}<h4>NED / INED（背景备查）</h4>${ta("F_ned",d.F_ned,3)}`)}
    ${sec("G","香港人脉入口",listEdit("G",d.G))}
    ${sec("H","公司 D&O Risk",kvEdit("H",H_F,d.H))}
    ${sec("I","开发价值评分",`<div class="score-grid">${I_F.map(f=>{const n=+d.I?.[f]||0;return `<div class="score"><span>${esc(f)}</span><span>${[1,2,3,4,5].map(k=>`<button type="button" class="starbtn ${k<=n?"on":""}" data-star="${esc(f)}" data-n="${k}" aria-label="${esc(f)} ${k} 星">★</button>`).join("")}</span></div>`}).join("")}</div>`)}
    <section class="sec"><h3>资料来源</h3><label class="f">每行一个来源（可贴网址）${ta("sources",(d.sources||[]).join("\n"),4)}</label></section>
    <section class="sec"><h3>删除档案</h3><div id="delZone">${confirmDel?`<div class="inline-confirm">确定删除「${esc(d.name)}」的全部档案？删除后无法恢复。<button class="btn small danger" type="button" id="delYes">确认删除</button><button class="btn small" type="button" id="delNo">保留</button></div>`:`<button class="btn small danger" type="button" id="delBtn">删除这家公司</button>`}</div></section>
  </div>`;
}
function setPath(p,v){
  const d=draft;
  if(p==="sources"){d.sources=v.split("\n").map(s=>s.trim()).filter(Boolean);return}
  if(p.startsWith("C_cols#")){d.C_cols[+p.split("#")[1]]=v;return}
  if(p.startsWith("C.")){const [f,i]=p.slice(2).split("#");(d.C[f]??=["","",""])[+i]=v;return}
  if(p.includes("#")){const [k,ri,ci]=p.split("#");d[k][+ri][+ci]=v;return}
  if(p.includes(".")){const i=p.indexOf(".");const s=p.slice(0,i),f=p.slice(i+1);(d[s]??={})[f]=v;return}
  d[p]=v;
}

/* ---------- control ---------- */
function show(){
  renderList();renderStats();
  if(editing)return;
  const d=docs.get(sel);
  if(d)renderView(d);
  else if(docs.size){sel=[...docs.values()].sort((a,b)=>sortKey(a)<sortKey(b)?-1:1)[0].code;renderList();renderView(docs.get(sel))}
  else $("#dossier").innerHTML=`<div class="empty-state"><h2>档案库还是空的</h2><p>点左上角「新增公司」，填入股份代号和名称，就能开始按模板录入。</p></div>`;
}
function select(code){
  if(editing){toast("请先保存或取消当前编辑");return}
  sel=code;confirmDel=false;
  try{history.replaceState(null,"","#c"+code)}catch(e){}
  show();$("#dossier").scrollIntoView({block:"start",behavior:"smooth"});
}
async function save(){
  if(!db)return;
  const btn=$("#saveBtn");btn.disabled=true;btn.textContent="保存中…";
  const body=structuredClone(draft);
  body.D=body.D.filter(r=>r.some(x=>String(x).trim()));
  for(const k of ["E","F_ed","F_cfo","G"])body[k]=body[k].filter(r=>r.some(x=>String(x).trim()));
  body.updatedAt=new Date().toISOString();
  try{await db.collection("companies").doc(body.code).set(body);editing=false;draft=null;docs.set(body.code,norm(body));show();toast("已保存")}
  catch(e){btn.disabled=false;btn.textContent="保存";
    if(e?.code==="invalid_argument"){canWrite=false;toast("你只有查看权限，无法保存")}else toast("保存失败，请稍后再试");}
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.code!==undefined&&t.classList.contains("item"))return select(t.dataset.code);
  if(t.dataset.f){filter=t.dataset.f;renderFilters();renderList();return}
  if(t.dataset.b){batch=t.dataset.b;renderFilters();renderList();renderStats();return}
  if(t.id==="editBtn"){draft=norm(docs.get(sel));editing=true;confirmDel=false;renderEdit();renderList();return}
  if(t.id==="cancelBtn"){editing=false;draft=null;show();return}
  if(t.id==="saveBtn")return save();
  if(t.dataset.addrow){const k=t.dataset.addrow;draft[k].push(LISTS[k].cols.map(()=>""));renderEdit();return}
  if(t.dataset.delrow){const [k,ri]=t.dataset.delrow.split("#");draft[k].splice(+ri,1);renderEdit();return}
  if(t.dataset.star){const f=t.dataset.star,n=+t.dataset.n;draft.I[f]=(+draft.I[f]===n)?n-1:n;renderEdit();return}
  if(t.id==="delBtn"){confirmDel=true;renderEdit();return}
  if(t.id==="delNo"){confirmDel=false;renderEdit();return}
  if(t.id==="delYes"){const code=draft.code;db.collection("companies").doc(code).delete().then(()=>{docs.delete(code);editing=false;draft=null;sel=null;confirmDel=false;show();toast("已删除")}).catch(()=>toast("删除失败"));return}
  if(t.id==="addBtn")return openAdd();
});
document.addEventListener("input",e=>{const p=e.target.dataset?.p;if(p&&draft)setPath(p,e.target.value)});
document.addEventListener("change",e=>{const p=e.target.dataset?.p;if(p&&draft&&e.target.tagName==="SELECT")setPath(p,e.target.value)});
$("#q").addEventListener("input",renderList);

function openAdd(){
  if(!db){toast("档案库暂时连不上，无法新增");return}
  if(editing){toast("请先保存或取消当前编辑");return}
  $("#modalRoot").innerHTML=`<div class="modal-back" id="mb"><form class="modal" id="addForm"><h3>新增公司</h3>
    <label class="f">股份代号（5 位，如 02539）<input id="nCode" required pattern="[0-9A-Za-z]{1,10}" inputmode="numeric"></label>
    <label class="f">公司简称<input id="nName" required></label>
    <label class="f">上市日期<input id="nDate" placeholder="如 12月3日"></label>
    <div class="note" id="nErr"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" type="button" id="nCancel">取消</button><button class="btn primary" type="submit">创建档案</button></div></form></div>`;
  $("#nCode").focus();
  $("#nCancel").onclick=()=>$("#modalRoot").innerHTML="";
  $("#addForm").onsubmit=async ev=>{ev.preventDefault();
    let code=$("#nCode").value.trim();if(/^\d+$/.test(code))code=code.padStart(5,"0");
    if(docs.has(code)){$("#nErr").textContent="这个代号已经有档案了。";return}
    const d=blank(code,$("#nName").value.trim());d.listDate=$("#nDate").value.trim();d.updatedAt=new Date().toISOString();
    try{await db.collection("companies").doc(code).set(d);docs.set(code,norm(d));$("#modalRoot").innerHTML="";sel=code;draft=norm(d);editing=true;renderEdit();renderList();renderStats()}
    catch(e){$("#nErr").textContent=e?.code==="invalid_argument"?"你只有查看权限，无法新增。":"创建失败，请稍后再试。"}
  };
}

renderFilters();
canWrite=false;$("#addBtn").hidden=true;
(async()=>{
  const h=(location.hash||"").replace(/^#c/,"");if(h)sel=h;
  try{
    const r=await fetch("data.json",{cache:"no-store"});
    const arr=await r.json();
    docs=new Map(arr.map(d=>[d.code,norm(d)]));
    const last=arr.map(d=>d.updatedAt||"").sort().pop();
    if(last)$(".sub").textContent+=" · 数据更新于 "+last.slice(0,10);
    show();
  }catch(e){$("#dossier").innerHTML=`<div class="empty-state"><h2>档案读取失败</h2><p>请刷新页面再试。</p></div>`}
})();
</script>

</body>
</html>
